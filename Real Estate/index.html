<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Replication Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= HEADER SECTION ================= -->
  <header class="navbar">
    <div class="nav-container">

      <a href="#" class="brand">
        <div class="brand-icon">
          <img src="./assets/logo.png" alt="Brand Logo" class="logo-img">
        </div>
        <span class="brand-text">Logo</span>
      </a>

      <nav class="nav-menu">
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link">
          <!-- Replace src with your downloaded Figma location icon -->
          <img src="./assets/location-icon.png" alt="Explore Icon" class="nav-icon">
          Explore
        </a>
        <a href="#" class="nav-link">About Us</a>
        <a href="#" class="nav-link">Contact Us</a>
      </nav>

      <button class="btn-primary">
        <img src="./assets/phone-icon.png" alt="Phone Icon" class="btn-icon">
        Request a call
      </button>

    </div>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="page-wrapper">
    <!-- ================= HERO SECTION ================= -->
    <section class="hero-section">
      <!-- Background image converted to an HTML img tag -->
      <img src="./assets/hero-bg.png" alt="Dream Home Background" class="hero-bg-img">

      <div class="hero-overlay"></div>

      <div class="hero-content">
        <h1 class="hero-title">YOUR DREAM HOME</h1>
        <h2 class="hero-subtitle">IS ONE CLICK AWAY</h2>

        <!-- Search Widget -->
        <div class="search-widget">
          <!-- Tabs -->
          <div class="search-tabs">
            <button class="tab active">ALL UNITS</button>
            <button class="tab">FOR RENT</button>
            <button class="tab">FOR SALE</button>
          </div>

          <!-- Form Container -->
          <div class="search-form-container">
            <form class="search-form" action="#" method="GET">

              <div class="form-group">
                <label>LOOKING FOR</label>
                <div class="select-wrapper">
                  <select required>
                    <option value="" disabled selected>Property Type</option>
                    <option value="apartment">Apartment</option>
                    <option value="house">House</option>
                    <option value="villa">Villa</option>
                  </select>
                  <!-- Dropdown Arrow Image -->
                  <img src="./assets/dropdown-arrow.png" alt="dropdown" class="dropdown-icon">
                </div>
              </div>

              <div class="form-group">
                <label>LOCATION</label>
                <div class="select-wrapper">
                  <select required>
                    <option value="" disabled selected>All Cities</option>
                    <option value="ny">New York</option>
                    <option value="la">Los Angeles</option>
                    <option value="ch">Chicago</option>
                  </select>
                  <!-- Dropdown Arrow Image -->
                  <img src="./assets/dropdown-arrow.png" alt="dropdown" class="dropdown-icon">
                </div>
              </div>

              <div class="form-group">
                <label>PROPERTY SIZE</label>
                <div class="select-wrapper">
                  <select required>
                    <option value="" disabled selected>Bedrooms</option>
                    <option value="1">1 Bedroom</option>
                    <option value="2">2 Bedrooms</option>
                    <option value="3">3+ Bedrooms</option>
                  </select>
                  <!-- Dropdown Arrow Image -->
                  <img src="./assets/dropdown-arrow.png" alt="dropdown" class="dropdown-icon">
                </div>
              </div>

              <div class="form-group">
                <label>BUDGET</label>
                <div class="select-wrapper">
                  <select required>
                    <option value="" disabled selected>Max. Price</option>
                    <option value="1000">$1,000</option>
                    <option value="2000">$2,000</option>
                    <option value="5000">$5,000+</option>
                  </select>
                  <!-- Dropdown Arrow Image -->
                  <img src="./assets/dropdown-arrow.png" alt="dropdown" class="dropdown-icon">
                </div>
              </div>

              <div class="form-group button-group">
                <button type="submit" class="btn-search">Search</button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </section>

    
  </main>

</body>

</html>
