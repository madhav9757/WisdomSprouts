<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal / Company Toggle – Form 4</title>
  <meta name="description" content="Registration form with Personal and Company mode toggle." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .back {
      position: fixed;
      top: 20px; left: 20px;
      text-decoration: none;
      color: #666;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
      z-index: 10;
    }
    .back:hover { color: #333; }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.1);
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      animation: fadeUp 0.45s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.025em;
      margin-bottom: 24px;
    }

    /* Toggle */
    .toggle-wrap {
      background: #f0f2f5;
      border-radius: 12px;
      padding: 4px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 28px;
    }

    .toggle-btn {
      padding: 10px;
      border: none;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.25s, color 0.25s, box-shadow 0.25s;
      color: #666;
      background: transparent;
    }

    .toggle-btn.active {
      background: #fff;
      color: #ff6b35;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #ff6b35;
      box-shadow: 0 0 0 3px rgba(255,107,53,0.12);
    }
    input::placeholder { color: #c0c0c0; }
    input:user-invalid { border-color: #ef4444; }
    .form-group:has(:user-invalid) label { color: #ef4444; }

    /* Gender radio */
    .gender-row {
      display: flex;
      gap: 12px;
    }
    .gender-opt {
      flex: 1;
      position: relative;
    }
    .gender-opt input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
    }
    .gender-opt label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      color: #888;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      margin: 0;
    }
    .gender-opt input[type="radio"]:checked + label {
      border-color: #ff6b35;
      color: #ff6b35;
      background: rgba(255,107,53,0.06);
    }

    .terms {
      font-size: 0.8rem;
      color: #888;
      text-align: center;
      margin: 16px 0;
      line-height: 1.5;
    }
    .terms a { color: #ff6b35; text-decoration: none; font-weight: 500; }

    .btn-register {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #ff6b35, #f7971e);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-register:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(255,107,53,0.35);
    }

    /* Company-only fields */
    .company-only { display: none; }
  </style>
</head>
<body>
  <a href="index.html" class="back">← Back to all forms</a>

  <div class="card">
    <h1>Create Account</h1>

    <!-- Toggle -->
    <div class="toggle-wrap" role="group" aria-label="Account type">
      <button type="button" class="toggle-btn active" id="btn-personal" aria-pressed="true">Personal</button>
      <button type="button" class="toggle-btn" id="btn-company" aria-pressed="false">Company</button>
    </div>

    <form id="toggle-form" novalidate>
      <div class="form-group">
        <label for="t-email">Email</label>
        <input type="email" id="t-email" name="email" placeholder="you@email.com" autocomplete="email" required />
      </div>

      <div class="form-group" id="name-group">
        <label for="t-name" id="name-label">Full Name</label>
        <input type="text" id="t-name" name="name" placeholder="John Doe" autocomplete="name" required />
      </div>

      <!-- Company-only field -->
      <div class="form-group company-only" id="company-group">
        <label for="t-company">Company Name</label>
        <input type="text" id="t-company" name="company" placeholder="Acme Corp." autocomplete="organization" />
      </div>

      <div class="form-group">
        <label for="t-password">Password</label>
        <input type="password" id="t-password" name="password" placeholder="Min. 8 characters" autocomplete="new-password" required minlength="8" />
      </div>

      <div class="form-group">
        <label>Gender</label>
        <div class="gender-row">
          <div class="gender-opt">
            <input type="radio" name="gender" id="gender-male" value="male" required />
            <label for="gender-male">♂ Male</label>
          </div>
          <div class="gender-opt">
            <input type="radio" name="gender" id="gender-female" value="female" />
            <label for="gender-female">♀ Female</label>
          </div>
        </div>
      </div>

      <p class="terms">By clicking Register, you agree to our <a href="#">terms and conditions</a>.</p>

      <button type="submit" class="btn-register" id="register-toggle-btn">Register</button>
    </form>
  </div>

  <script>
    const btnPersonal = document.getElementById('btn-personal');
    const btnCompany = document.getElementById('btn-company');
    const companyGroup = document.getElementById('company-group');
    const companyInput = document.getElementById('t-company');
    const nameLabel = document.getElementById('name-label');

    btnPersonal.addEventListener('click', () => {
      btnPersonal.classList.add('active');
      btnPersonal.setAttribute('aria-pressed', 'true');
      btnCompany.classList.remove('active');
      btnCompany.setAttribute('aria-pressed', 'false');
      companyGroup.style.display = 'none';
      companyInput.required = false;
      nameLabel.textContent = 'Full Name';
    });

    btnCompany.addEventListener('click', () => {
      btnCompany.classList.add('active');
      btnCompany.setAttribute('aria-pressed', 'true');
      btnPersonal.classList.remove('active');
      btnPersonal.setAttribute('aria-pressed', 'false');
      companyGroup.style.display = '';
      companyGroup.style.display = 'block';
      companyInput.required = true;
      nameLabel.textContent = 'Contact Name';
    });

    document.getElementById('toggle-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!e.target.checkValidity()) { e.target.reportValidity(); return; }
      alert('Account registered! 🎉');
    });
  </script>
</body>
</html>
