<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram – Log in</title>
  <meta name="description" content="Instagram login page clone matching the official dark design." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #121212;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Back link ── */
    .back {
      position: fixed;
      top: 18px; left: 18px;
      text-decoration: none;
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
      z-index: 20;
    }
    .back:hover { color: #fff; }

    /* ── Main split layout ── */
    .page {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    /* ══════════════════════════
       LEFT PANEL
    ══════════════════════════ */
    .left {
      background: #000;
      display: flex;
      flex-direction: column;
      padding: 32px 40px 40px;
      position: relative;
      overflow: hidden;
    }

    /* Instagram icon top-left */
    .ig-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      margin-bottom: 48px;
    }

    /* Big headline */
    .headline {
      font-size: clamp(1.5rem, 2.6vw, 2.2rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      letter-spacing: -0.02em;
      max-width: 420px;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    .headline .highlight {
      /* Pink/magenta gradient text matching Instagram brand */
      background: linear-gradient(90deg, #e1306c, #c13584);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Photo collage */
    .collage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .collage img {
      width: 100%;
      max-width: 440px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 24px 48px rgba(0,0,0,0.7));
    }

    /* ══════════════════════════
       RIGHT PANEL
    ══════════════════════════ */
    .right {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 64px;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* "Log into Instagram" */
    .login-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f5f5f5;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    /* Input fields */
    .input-field {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 14px 16px;
      color: #f5f5f5;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 10px;
    }

    .input-field::placeholder {
      color: #7a7a7a;
      font-size: 0.88rem;
    }

    .input-field:focus {
      border-color: #555;
    }

    /* Log in button */
    .btn-login {
      width: 100%;
      padding: 13px;
      margin-top: 4px;
      background: #0064d9;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.01em;
    }
    .btn-login:hover { background: #0057bf; }

    /* Forgot password */
    .forgot {
      text-align: center;
      margin-top: 18px;
      margin-bottom: 18px;
    }
    .forgot a {
      color: #f5f5f5;
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
    }
    .forgot a:hover { text-decoration: underline; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #3a3a3a;
    }
    .divider span {
      color: #7a7a7a;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    /* Log in with Facebook */
    .btn-facebook {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 12px;
      color: #4a90d9;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 18px;
    }
    .btn-facebook:hover { background: #333; }

    /* Create new account */
    .btn-create {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1.5px solid #4a90d9;
      border-radius: 8px;
      background: transparent;
      color: #4a90d9;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      margin-bottom: 28px;
    }
    .btn-create:hover { background: rgba(74,144,217,0.08); }

    /* Meta logo */
    .meta-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #7a7a7a;
      font-size: 0.82rem;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .page { grid-template-columns: 1fr; }
      .left { display: none; }
      .right { padding: 48px 24px; }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back">← All forms</a>

  <div class="page">

    <!-- ════ LEFT PANEL ════ -->
    <section class="left">

      <!-- Instagram icon (SVG gradient) -->
      <svg class="ig-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="ig1" cx="30%" cy="107%" r="100%">
            <stop offset="0%" stop-color="#ffd600"/>
            <stop offset="50%" stop-color="#ff7a00"/>
            <stop offset="100%" stop-color="#ff0069"/>
          </radialGradient>
          <radialGradient id="ig2" cx="10%" cy="10%" r="90%">
            <stop offset="0%" stop-color="#a033ff"/>
            <stop offset="100%" stop-color="#ff0069" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="48" height="48" rx="12" fill="url(#ig1)"/>
        <rect width="48" height="48" rx="12" fill="url(#ig2)"/>
        <rect x="11" y="11" width="26" height="26" rx="7" stroke="#fff" stroke-width="3" fill="none"/>
        <circle cx="24" cy="24" r="7" stroke="#fff" stroke-width="3" fill="none"/>
        <circle cx="35" cy="13" r="2.5" fill="#fff"/>
      </svg>

      <!-- Headline -->
      <h1 class="headline">
        See everyday moments from<br>
        your <span class="highlight">close friends.</span>
      </h1>

      <!-- Photo collage -->
      <div class="collage">
        <img
          src="assests/instagram/image.png"
          alt="Friends sharing moments on Instagram"
          width="440"
          height="440"
        />
      </div>

    </section>

    <!-- ════ RIGHT PANEL ════ -->
    <section class="right">
      <div class="login-box">

        <h2 class="login-title">Log into Instagram</h2>

        <form id="ig-login-form" novalidate>
          <input
            type="text"
            id="ig-user"
            name="username"
            class="input-field"
            placeholder="Mobile number, username or email"
            autocomplete="username"
            required
          />
          <input
            type="password"
            id="ig-pass"
            name="password"
            class="input-field"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <button type="submit" class="btn-login" id="ig-login-btn">Log in</button>
        </form>

        <div class="forgot">
          <a href="#" id="ig-forgot">Forgot password?</a>
        </div>

        <div class="divider"><span>OR</span></div>

        <!-- Log in with Facebook -->
        <button type="button" class="btn-facebook" id="ig-fb-btn">
          <!-- Facebook icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#4a90d9">
            <path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.88v2.27h3.32l-.53 3.5h-2.8V24C19.62 23.1 24 18.1 24 12.07z"/>
          </svg>
          Log in with Facebook
        </button>

        <!-- Create new account -->
        <a href="#" class="btn-create" id="ig-create-btn">Create new account</a>

        <!-- Meta logo -->
        <div class="meta-logo">
          <!-- Meta ∞ wordmark -->
          <svg width="54" height="18" viewBox="0 0 54 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Infinity / Meta symbol -->
            <path d="M7 9C7 6.8 8.3 5.5 9.8 5.5c1.3 0 2.1.8 3.2 2.8C14.1 6.3 15.2 5.5 16.5 5.5c1.5 0 2.8 1.3 2.8 3.5 0 2.1-1.3 3.5-2.8 3.5-1.3 0-2.4-.8-3.5-2.8C11.9 11.7 11 12.5 9.8 12.5 8.3 12.5 7 11.2 7 9z" fill="#7a7a7a"/>
            <path d="M13 9c1.2 2 2.1 3.5 3.5 3.5 1.1 0 2-1 2-3.5s-.9-3.5-2-3.5C15.1 5.5 14.2 7 13 9z" fill="#7a7a7a" opacity="0.7"/>
            <!-- Meta text -->
            <text x="22" y="13" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="600" fill="#7a7a7a" letter-spacing="0.5">Meta</text>
          </svg>
        </div>

      </div>
    </section>

  </div>

  <script>
    document.getElementById('ig-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!e.target.checkValidity()) { e.target.reportValidity(); return; }
      alert('Logged in successfully!');
    });

    document.getElementById('ig-fb-btn').addEventListener('click', () => {
      alert('Redirecting to Facebook login...');
    });

    document.getElementById('ig-forgot').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Password reset link sent!');
    });

    document.getElementById('ig-create-btn').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Redirecting to sign up...');
    });
  </script>

</body>
</html>
