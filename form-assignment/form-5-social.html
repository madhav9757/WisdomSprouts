<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Form 5</title>
  <meta name="description" content="Social sign up form with Welcome Back panel." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      /* Olive-green gradient background matching the reference */
      background: linear-gradient(135deg, #2d5a1b 0%, #4a7c20 40%, #8db52a 100%);
    }

    /* ── Back link ── */
    .back {
      position: fixed;
      top: 16px;
      left: 16px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8rem;
      z-index: 20;
    }
    .back:hover { color: #fff; }

    /* ── Outer card (white rounded rect) ── */
    .card {
      display: flex;
      width: 100%;
      max-width: 960px;
      min-height: 520px;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    /* ══════════════════════════
       LEFT PANEL – dark teal blob
    ══════════════════════════ */
    .left {
      flex: 0 0 42%;
      background: #1a5c5a;
      /* Blob shape: rounded heavily on the right edge */
      border-radius: 16px 120px 120px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 48px;
      gap: 20px;
    }

    .left h2 {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .left p {
      font-size: 0.95rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.6;
      max-width: 220px;
    }

    /* SIGN IN outlined button */
    .btn-signin {
      margin-top: 8px;
      padding: 13px 44px;
      background: transparent;
      border: 2px solid #ffffff;
      border-radius: 4px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-signin:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* ══════════════════════════
       RIGHT PANEL – white
    ══════════════════════════ */
    .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 60px;
    }

    .right h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    /* ── Social icon buttons row ── */
    .social-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .social-btn {
      width: 52px;
      height: 52px;
      border: 1.5px solid #c0c0c0;
      border-radius: 8px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 700;
      color: #333;
      transition: border-color 0.2s, background 0.2s;
    }
    .social-btn:hover {
      border-color: #1a5c5a;
      background: #f0faf9;
    }

    /* ── OR divider ── */
    .or-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .fill-text {
      font-size: 0.72rem;
      color: #888;
      margin-bottom: 16px;
      text-align: center;
    }

    /* ── Inputs ── */
    .input-field {
      width: 100%;
      background: #d9d9d9;
      border: none;
      border-radius: 4px;
      padding: 15px 18px;
      font-family: inherit;
      font-size: 0.95rem;
      color: #333;
      outline: none;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    .input-field::placeholder {
      color: #888;
      font-size: 0.83rem;
    }
    .input-field:focus {
      background: #cccccc;
    }

    /* ── SIGN UP button ── */
    .btn-signup {
      width: 100%;
      padding: 15px;
      background: #c8d400;
      border: none;
      border-radius: 4px;
      color: #1a1a1a;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s;
    }
    .btn-signup:hover {
      background: #b5bf00;
    }

    /* ── Responsive ── */
    @media (max-width: 580px) {
      .card { flex-direction: column; }
      .left {
        border-radius: 16px 16px 80px 80px;
        padding: 36px 24px;
        flex: 0 0 auto;
      }
      .right { padding: 32px 24px; }
    }

  </style>
</head>
<body>

  <a href="index.html" class="back">← All forms</a>

  <div class="card">

    <!-- ════ LEFT PANEL ════ -->
    <div class="left">
      <h2>Welcome Back!</h2>
      <p>Provide your personal details to use all features</p>
      <button type="button" class="btn-signin" id="signin-btn">Sign In</button>
    </div>

    <!-- ════ RIGHT PANEL ════ -->
    <div class="right">

      <h2>Register With</h2>

      <!-- Social icon buttons -->
      <div class="social-row" role="group" aria-label="Register with social account">

        <!-- Google+ -->
        <button type="button" class="social-btn" id="soc-google" title="Register with Google">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5c-.2 1.2-.9 2.3-2 3v2.5h3.2c1.9-1.7 3.1-4.3 3.1-7.3z" fill="#4285F4"/>
            <path d="M12 22c2.7 0 5-0.9 6.7-2.4l-3.2-2.5c-.9.6-2 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.9v2.6C4.6 19.9 8.1 22 12 22z" fill="#34A853"/>
            <path d="M6.2 13.8c-.2-.6-.3-1.2-.3-1.8s.1-1.2.3-1.8V7.6H2.9C2.3 8.8 2 10.4 2 12s.3 3.2.9 4.4l3.3-2.6z" fill="#FBBC05"/>
            <path d="M12 5.9c1.5 0 2.9.5 3.9 1.5l2.9-2.9C17 2.9 14.7 2 12 2 8.1 2 4.6 4.1 2.9 7.6l3.3 2.6C7 7.7 9.3 5.9 12 5.9z" fill="#EA4335"/>
            <!-- Plus sign -->
            <text x="18" y="8" font-size="7" font-weight="900" fill="#EA4335">+</text>
          </svg>
        </button>

        <!-- Facebook -->
        <button type="button" class="social-btn" id="soc-fb" title="Register with Facebook">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.88v2.27h3.32l-.53 3.5h-2.8V24C19.62 23.1 24 18.1 24 12.07z"/>
          </svg>
        </button>

        <!-- GitHub -->
        <button type="button" class="social-btn" id="soc-gh" title="Register with GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#333">
            <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
          </svg>
        </button>

        <!-- LinkedIn -->
        <button type="button" class="social-btn" id="soc-li" title="Register with LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#0A66C2">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </button>

      </div>

      <p class="or-text">OR</p>
      <p class="fill-text">Fill Out The Following Info For Registeration</p>

      <form id="signup-form" novalidate style="width: 100%;">
        <input type="text"     id="s-name"     name="name"     class="input-field" placeholder="Name"     autocomplete="name"         required />
        <input type="email"    id="s-email"    name="email"    class="input-field" placeholder="Email"    autocomplete="email"        required />
        <input type="password" id="s-password" name="password" class="input-field" placeholder="Password" autocomplete="new-password" required minlength="8" />
        <button type="submit" class="btn-signup" id="signup-btn">Sign Up</button>
      </form>

    </div>
  </div>

  <script>
    document.getElementById('signup-form').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!e.target.checkValidity()) { e.target.reportValidity(); return; }
      alert('Account created! 🎉');
    });

    document.getElementById('signin-btn').addEventListener('click', function() {
      alert('Redirecting to Sign In...');
    });

    ['google','fb','gh','li'].forEach(function(id) {
      document.getElementById('soc-' + id).addEventListener('click', function() {
        alert('Registering with ' + id + '...');
      });
    });
  </script>

</body>
</html>
