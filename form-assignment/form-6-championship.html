<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Championship Registration – Form 6</title>
  <meta name="description" content="School sports championship registration form with student, parent details, and verification." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/form-6.css" />
</head>
<body>
  <a href="index.html" class="back">← Back to all forms</a>

  <div class="wrapper">
    <div class="trophy-header">
      <div class="trophy-icon">🏆</div>
      <div>
        <h1>Championship Registration</h1>
      </div>
    </div>
    <p class="subtitle">Fill in the details below to register for the school sports championship.</p>

    <form id="champ-form" novalidate>

      <!-- School Info -->
      <div class="section-label">School Information</div>
      <div class="form-grid">
        <div class="form-group full">
          <label for="school-name">School Name</label>
          <input type="text" id="school-name" name="schoolName" placeholder="e.g. Springfield High School" autocomplete="organization" required />
        </div>
      </div>

      <!-- Student Details -->
      <div class="section-label">Student Details</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="s-first">First Name</label>
          <input type="text" id="s-first" name="studentFirst" placeholder="John" autocomplete="given-name" required />
        </div>
        <div class="form-group">
          <label for="s-last">Last Name</label>
          <input type="text" id="s-last" name="studentLast" placeholder="Doe" autocomplete="family-name" required />
        </div>
      </div>

      <!-- Parent Details -->
      <div class="section-label">Parent / Guardian Details</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="p-first">Parent First Name</label>
          <input type="text" id="p-first" name="parentFirst" placeholder="Jane" autocomplete="given-name" required />
        </div>
        <div class="form-group">
          <label for="p-last">Parent Last Name</label>
          <input type="text" id="p-last" name="parentLast" placeholder="Doe" autocomplete="family-name" required />
        </div>
        <div class="form-group">
          <label for="p-phone">Parent Phone</label>
          <input type="tel" id="p-phone" name="parentPhone" placeholder="+91 00000 00000" autocomplete="tel" required />
        </div>
        <div class="form-group">
          <label for="p-email">Parent Email</label>
          <input type="email" id="p-email" name="parentEmail" placeholder="parent@email.com" autocomplete="email" required />
        </div>
      </div>

      <!-- Sport -->
      <div class="section-label">Preferred Sport</div>
      <div class="form-grid">
        <div class="form-group full">
          <label for="sport">Select Sport</label>
          <select id="sport" name="sport" required>
            <option value="" disabled selected>-- Choose a sport --</option>
            <option value="football">⚽ Football</option>
            <option value="basketball">🏀 Basketball</option>
            <option value="cricket">🏏 Cricket</option>
            <option value="tennis">🎾 Tennis</option>
            <option value="badminton">🏸 Badminton</option>
            <option value="volleyball">🏐 Volleyball</option>
            <option value="athletics">🏃 Athletics</option>
            <option value="swimming">🏊 Swimming</option>
          </select>
        </div>
      </div>

      <!-- reCAPTCHA mock -->
      <div class="captcha-box">
        <input type="checkbox" class="captcha-check" id="captcha-check" required aria-label="I'm not a robot" />
        <label class="captcha-label" for="captcha-check">I'm not a robot</label>
        <div class="captcha-logo">
          <strong>reCAPTCHA</strong>
          Privacy · Terms
        </div>
      </div>

      <button type="submit" class="btn-submit" id="champ-submit-btn">Submit Registration</button>
    </form>
  </div>

  <script>
    document.getElementById('champ-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const captcha = document.getElementById('captcha-check');
      if (!captcha.checked) {
        alert('Please verify that you are not a robot.');
        return;
      }
      if (!e.target.checkValidity()) { e.target.reportValidity(); return; }
      alert('Registration submitted successfully! 🏆 Good luck!');
    });
  </script>
</body>
</html>
