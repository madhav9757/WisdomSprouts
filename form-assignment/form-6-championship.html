<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Championship Registration – Form 6</title>
  <meta name="description" content="School sports championship registration form with parent details and reCAPTCHA." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(160deg, #0a0a0f 0%, #0d1b2a 60%, #1a0d2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '🏆';
      position: fixed;
      font-size: 30vw;
      opacity: 0.03;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
    }

    .back {
      position: fixed;
      top: 20px; left: 20px;
      text-decoration: none;
      color: rgba(255,255,255,0.4);
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
      z-index: 10;
    }
    .back:hover { color: #fff; }

    .wrapper {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 52px 48px;
      width: 100%;
      max-width: 620px;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .trophy-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .trophy-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #f7c948, #e8902e);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 8px 24px rgba(247,201,72,0.3);
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .subtitle {
      color: rgba(255,255,255,0.4);
      font-size: 0.84rem;
      margin-bottom: 36px;
      margin-top: 6px;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f7c948;
      margin-bottom: 16px;
      margin-top: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-label:first-of-type { margin-top: 0; }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(247,201,72,0.2);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 0.76rem;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.04em;
    }

    input, select {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      padding: 11px 14px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    select option { background: #0d1b2a; }
    input::placeholder { color: rgba(255,255,255,0.18); }

    input:focus, select:focus {
      border-color: rgba(247,201,72,0.5);
      box-shadow: 0 0 0 3px rgba(247,201,72,0.1);
    }
    input:user-invalid { border-color: rgba(255,80,80,0.5); }
    .form-group:has(:user-invalid) label { color: rgba(255,120,120,0.85); }

    /* reCAPTCHA mock */
    .captcha-box {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f9f9f9;
      border: 1px solid #d3d3d3;
      border-radius: 4px;
      padding: 14px 16px;
      margin-top: 24px;
    }

    .captcha-check {
      appearance: none;
      -webkit-appearance: none;
      width: 24px; height: 24px;
      border: 2px solid #c1c1c1;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: border-color 0.2s;
      background: #fff;
    }
    .captcha-check:checked {
      background: #4caf50;
      border-color: #4caf50;
    }
    .captcha-check:checked::after {
      content: '';
      position: absolute;
      top: 3px; left: 6px;
      width: 6px; height: 11px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .captcha-label {
      font-size: 0.88rem;
      color: #333;
      flex: 1;
    }
    .captcha-logo {
      text-align: right;
      font-size: 0.65rem;
      color: #aaa;
      flex-shrink: 0;
    }
    .captcha-logo strong { display: block; font-size: 0.7rem; color: #4a90e2; }

    .btn-submit {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      background: linear-gradient(135deg, #f7c948, #e8902e);
      border: none;
      border-radius: 12px;
      color: #0a0a0f;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .btn-submit:hover {
      opacity: 0.92;
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(247,201,72,0.35);
    }
    .btn-submit:active { transform: translateY(0); }

    @media (max-width: 540px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
      .wrapper { padding: 36px 24px; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← Back to all forms</a>

  <div class="wrapper">
    <div class="trophy-header">
      <div class="trophy-icon">🏆</div>
      <div>
        <h1>Championship<br/>Registration</h1>
      </div>
    </div>
    <p class="subtitle">Fill in the details below to register for the school sports championship.</p>

    <form id="champ-form" novalidate>

      <!-- School Info -->
      <div class="section-label">School Information</div>
      <div class="form-grid">
        <div class="form-group full">
          <label for="school-name">School Name</label>
          <input type="text" id="school-name" name="schoolName" placeholder="e.g. Springfield High School" autocomplete="organization" required />
        </div>
      </div>

      <!-- Schooler Details -->
      <div class="section-label">Student Details</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="s-first">First Name</label>
          <input type="text" id="s-first" name="studentFirst" placeholder="John" autocomplete="given-name" required />
        </div>
        <div class="form-group">
          <label for="s-last">Last Name</label>
          <input type="text" id="s-last" name="studentLast" placeholder="Doe" autocomplete="family-name" required />
        </div>
      </div>

      <!-- Parent Details -->
      <div class="section-label">Parent / Guardian Details</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="p-first">Parent First Name</label>
          <input type="text" id="p-first" name="parentFirst" placeholder="Jane" autocomplete="given-name" required />
        </div>
        <div class="form-group">
          <label for="p-last">Parent Last Name</label>
          <input type="text" id="p-last" name="parentLast" placeholder="Doe" autocomplete="family-name" required />
        </div>
        <div class="form-group">
          <label for="p-phone">Parent Phone</label>
          <input type="tel" id="p-phone" name="parentPhone" placeholder="+91 00000 00000" autocomplete="tel" required />
        </div>
        <div class="form-group">
          <label for="p-email">Parent Email</label>
          <input type="email" id="p-email" name="parentEmail" placeholder="parent@email.com" autocomplete="email" required />
        </div>
      </div>

      <!-- Sport -->
      <div class="section-label">Preferred Sport</div>
      <div class="form-grid">
        <div class="form-group full">
          <label for="sport">Select Sport</label>
          <select id="sport" name="sport" required>
            <option value="" disabled selected>-- Choose a sport --</option>
            <option value="football">⚽ Football</option>
            <option value="basketball">🏀 Basketball</option>
            <option value="cricket">🏏 Cricket</option>
            <option value="tennis">🎾 Tennis</option>
            <option value="badminton">🏸 Badminton</option>
            <option value="volleyball">🏐 Volleyball</option>
            <option value="athletics">🏃 Athletics</option>
            <option value="swimming">🏊 Swimming</option>
          </select>
        </div>
      </div>

      <!-- reCAPTCHA mock -->
      <div class="captcha-box">
        <input type="checkbox" class="captcha-check" id="captcha-check" required aria-label="I'm not a robot" />
        <label class="captcha-label" for="captcha-check">I'm not a robot</label>
        <div class="captcha-logo">
          <strong>reCAPTCHA</strong>
          Privacy · Terms
        </div>
      </div>

      <button type="submit" class="btn-submit" id="champ-submit-btn">Submit Registration</button>
    </form>
  </div>

  <script>
    document.getElementById('champ-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const captcha = document.getElementById('captcha-check');
      if (!captcha.checked) {
        alert('Please verify that you are not a robot.');
        return;
      }
      if (!e.target.checkValidity()) { e.target.reportValidity(); return; }
      alert('Registration submitted successfully! 🏆 Good luck!');
    });
  </script>
</body>
</html>
