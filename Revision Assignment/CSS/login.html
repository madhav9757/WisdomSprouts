
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111111, #292929, #444444);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 350px;
            padding: 35px;
            background: #111;
            border: 1px solid #555;
            box-shadow: 8px 8px 0 white;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #555;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border: 1px solid white;
            box-shadow: 3px 3px 0 white;
        }

        input:invalid:not(:placeholder-shown) {
            border: 1px solid #ff4444;
        }

        input:valid:not(:placeholder-shown) {
            border: 1px solid #55cc88;
        }

        button {
            width: 100%;
            padding: 13px;
            background: white;
            color: black;
            border: 1px solid white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: black;
            color: white;
            box-shadow: 4px 4px 0 white;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <h1>LOGIN</h1>

        <form>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit">SIGN IN</button>

        </form>

    </div>

</body>
</html>
