<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Identity Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            width: 300px;
            background-color: #1c1c1c;
            text-align: center;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.12);
            border-color: white;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
        }

        h2 {
            color: white;
            margin-bottom: 5px;
        }

        h4 {
            color: #bdbdbd;
            margin-top: 5px;
        }

        p {
            color: #999;
            font-size: 14px;
            line-height: 1.6;
        }

        .social-links {
            margin-top: 20px;
        }

        .social-links a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            background-color: white;
            padding: 10px;
            margin: 5px;
            border-radius: 50%;
            transition: 0.3s;
            width: 25px;
            height: 25px;
        }

        .social-links a img {
            width: 22px;
            height: 22px;
        }

        .social-links a:hover {
            background-color: #bdbdbd;
            transform: scale(1.2);
        }

    </style>
</head>

<body>

    <div class="card">

        <img src="profile.jpg" alt="Profile Image" class="profile-img">

        <h2>Madhav Semwal</h2>

        <h4>Full Stack Developer</h4>

        <p>
            I am a passionate Computer Engineering student interested in
            web development, backend systems, and building innovative applications.
        </p>

        <div class="social-links">

            <a href="https://github.com/madhav9757" target="_blank">
                <img src="./github-svgrepo-com.svg" alt="GitHub">
            </a>

            <a href="https://www.linkedin.com/in/madhav9757/" target="_blank">
                <img src="linkedin-svgrepo-com.svg" alt="LinkedIn">
            </a>

            <a href="mailto:yourmail@example.com">
                <img src="email-svgrepo-com.svg" alt="Email">
            </a>

        </div>

    </div>

</body>

</html>
