<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Admission Form</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 20px;}
        form {max-width: 600px;}
        label {display: block; margin-top: 12px; font-weight: bold;}
        input, textarea, select {width: 100%; padding: 6px; margin-top: 4px;}
        .inline-group {display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px;}
        .inline-group label {font-weight: normal;}
        .buttons {margin-top: 20px;}
    </style>
</head>
<body>
    <h1>Student Admission Form</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10-digit number" required />

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required />

        <fieldset>
            <legend>Gender</legend>
            <div class="inline-group">
                <label><input type="radio" name="gender" value="male" required /> Male</label>
                <label><input type="radio" name="gender" value="female" /> Female</label>
                <label><input type="radio" name="gender" value="other" /> Other</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Hobbies</legend>
            <div class="inline-group">
                <label><input type="checkbox" name="hobbies" value="reading" /> Reading</label>
                <label><input type="checkbox" name="hobbies" value="travel" /> Travel</label>
                <label><input type="checkbox" name="hobbies" value="music" /> Music</label>
                <label><input type="checkbox" name="hobbies" value="sports" /> Sports</label>
                <label><input type="checkbox" name="hobbies" value="coding" /> Coding</label>
            </div>
        </fieldset>

        <label for="address">Address</label>
        <textarea id="address" name="address" rows="4" required></textarea>

        <label for="course">Course</label>
        <select id="course" name="course" required>
            <option value="" disabled selected>Select a course</option>
            <option value="cs">Computer Science</option>
            <option value="ee">Electrical Engineering</option>
            <option value="me">Mechanical Engineering</option>
            <option value="ba">Business Administration</option>
        </select>

        <label for="profilePic">Profile Picture</label>
        <input type="file" id="profilePic" name="profilePic" accept="image/*" />

        <label for="favColor">Favorite Color</label>
        <input type="color" id="favColor" name="favColor" />

        <label for="skillLevel">Skills Level</label>
        <input type="range" id="skillLevel" name="skillLevel" min="0" max="100" />

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>
    </form>
</body>
</html>
